name: Validate agent guidance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify generated guidance and canonical configuration
        run: bun .agents/scripts/signoff.mjs
