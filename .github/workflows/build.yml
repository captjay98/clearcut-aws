name: Build and verify one ClearCut release image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment with required human reviewers
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

# Terraform plan/apply: NO-GO. Exact saved-plan approval and remote state
# safeguards must be established separately; these workflows do not provision.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.11"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - name: Install locked workspaces
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages --dev --frozen
      - name: Run complete provider-free release verification
        run: |
          pnpm verify
          uv run ruff check services/api/src services/api/tests tests scripts
          uv run pyright services/api/src services/api/tests
          uv run pytest services/api/tests -q
          pnpm --filter clearcut-web test
          pnpm build

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
    steps:
      - name: Validate release inputs before authentication
        id: validate_inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(os.environ['RELEASE_ENVIRONMENT'] in ('staging', 'production'), 'Invalid environment')
          require(re.fullmatch(r'[a-z][a-z0-9-]{4,28}[a-z0-9]', os.environ['GCP_PROJECT_ID']), 'Invalid project')
          require(re.fullmatch(r'[a-z]+-[a-z]+[0-9]', os.environ['GCP_REGION']), 'Invalid region')
          require(re.fullmatch(r'[a-z][a-z0-9-]{0,62}', os.environ['ARTIFACT_REPOSITORY']), 'Invalid artifact repository')
          registry = os.environ['GCP_REGION'] + '-docker.pkg.dev'
          repository = '/'.join((registry, os.environ['GCP_PROJECT_ID'], os.environ['ARTIFACT_REPOSITORY'], 'clearcut'))
          image = os.environ.get('IMAGE')
          if image is not None:
              require(re.fullmatch(re.escape(repository) + r'@sha256:[a-f0-9]{64}', image), 'Expected one clearcut@sha256 digest in the configured repository')
              require(re.fullmatch(r'[1-9][0-9]*', os.environ['EVIDENCE_RUN_ID']), 'Invalid evidence run ID')
              require(os.environ['CONFIRMATION'] == os.environ['EXPECTED_CONFIRMATION'], 'Missing release authorization')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'registry={registry}\nimage_repository={repository}\n')
              output.write(f"image_tag={repository}:run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}\n")
          PY
      - name: Authenticate with keyless Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          create_credentials_file: false
          token_format: access_token

      - name: Authenticate Docker using the short-lived federated token
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.validate_inputs.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the single unified runtime
        id: image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          tags: ${{ steps.validate_inputs.outputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Record digest-bound build evidence
        id: record_evidence
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.validate_inputs.outputs.image_repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import UTC, datetime
          from pathlib import Path

          digest = os.environ['DIGEST']
          if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest):
              raise SystemExit('Build did not produce an immutable digest')
          receipt = {
              'schema_version': 1,
              'kind': 'build',
              'result': 'success',
              'image': os.environ['IMAGE_REPOSITORY'] + '@' + digest,
              'environment': os.environ['RELEASE_ENVIRONMENT'],
              'project': os.environ['GCP_PROJECT_ID'],
              'region': os.environ['GCP_REGION'],
              'source_sha': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.now(UTC).isoformat(),
          }
          Path('build-evidence.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f"Built `{receipt['image']}` from `{receipt['source_sha']}`.\n")
          PY

      - name: Preserve immutable build evidence
        id: upload_evidence
        uses: actions/upload-artifact@v4
        with:
          name: clearcut-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-evidence.json
          if-no-files-found: error
          retention-days: 30
