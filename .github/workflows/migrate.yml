name: Run protected unified migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment with required human reviewers
        required: true
        type: choice
        options: [staging, production]
      image_digest:
        description: Immutable configured repository/clearcut@sha256 digest from the build receipt
        required: true
        type: string
      build_run_id:
        description: Successful build workflow run ID for the same digest and source SHA
        required: true
        type: string
      confirmation:
        description: Type MIGRATE to authorize this protected operation
        required: true
        type: string

permissions:
  contents: read

# Both mutation workflows serialize by environment, including migration job updates.
concurrency:
  group: clearcut-release-${{ inputs.environment }}
  cancel-in-progress: false

# Terraform plan/apply: NO-GO until exact saved-plan human approval is established.
jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      IMAGE: ${{ inputs.image_digest }}
      EVIDENCE_RUN_ID: ${{ inputs.build_run_id }}
      EVIDENCE_KIND: build
      EVIDENCE_FILE: release-evidence/build-evidence.json
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_CONFIRMATION: MIGRATE
      MIGRATION_JOB: clearcut-migrate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release inputs before authentication
        id: validate_inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(os.environ['RELEASE_ENVIRONMENT'] in ('staging', 'production'), 'Invalid environment')
          require(re.fullmatch(r'[a-z][a-z0-9-]{4,28}[a-z0-9]', os.environ['GCP_PROJECT_ID']), 'Invalid project')
          require(re.fullmatch(r'[a-z]+-[a-z]+[0-9]', os.environ['GCP_REGION']), 'Invalid region')
          require(re.fullmatch(r'[a-z][a-z0-9-]{0,62}', os.environ['ARTIFACT_REPOSITORY']), 'Invalid artifact repository')
          registry = os.environ['GCP_REGION'] + '-docker.pkg.dev'
          repository = '/'.join((registry, os.environ['GCP_PROJECT_ID'], os.environ['ARTIFACT_REPOSITORY'], 'clearcut'))
          image = os.environ.get('IMAGE')
          if image is not None:
              require(re.fullmatch(re.escape(repository) + r'@sha256:[a-f0-9]{64}', image), 'Expected one clearcut@sha256 digest in the configured repository')
              require(re.fullmatch(r'[1-9][0-9]*', os.environ['EVIDENCE_RUN_ID']), 'Invalid evidence run ID')
              require(os.environ['CONFIRMATION'] == os.environ['EXPECTED_CONFIRMATION'], 'Missing release authorization')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'registry={registry}\nimage_repository={repository}\n')
              output.write(f"image_tag={repository}:run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}\n")
          PY

      - name: Verify successful upstream workflow provenance
        id: verify_run
        uses: actions/github-script@v7
        env:
          EXPECTED_WORKFLOW: .github/workflows/build.yml
        with:
          script: |
            const runId = process.env.EVIDENCE_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(runId) || !Number.isSafeInteger(Number(runId))) {
              throw new Error('Invalid evidence run ID');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(runId)
            });
            if (String(run.id) !== runId || run.status !== 'completed' ||
                run.conclusion !== 'success' || run.event !== 'workflow_dispatch' ||
                run.path !== process.env.EXPECTED_WORKFLOW ||
                run.head_sha !== context.sha || run.head_branch !== 'main' ||
                run.repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) {
              throw new Error('Upstream evidence must come from a successful same-repository main workflow at this exact source SHA');
            }
            core.setOutput('attempt', String(run.run_attempt));

      - name: Download exact upstream run attempt evidence
        id: download_evidence
        uses: actions/download-artifact@v4
        with:
          name: clearcut-build-${{ env.EVIDENCE_RUN_ID }}-${{ steps.verify_run.outputs.attempt }}
          path: release-evidence
          run-id: ${{ env.EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate digest-bound upstream evidence
        id: verify_evidence
        shell: bash
        env:
          EVIDENCE_RUN_ATTEMPT: ${{ steps.verify_run.outputs.attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = json.loads(Path(os.environ['EVIDENCE_FILE']).read_text())
          expected = {
              'schema_version': 1,
              'kind': os.environ['EVIDENCE_KIND'],
              'result': 'success',
              'image': os.environ['IMAGE'],
              'environment': os.environ['RELEASE_ENVIRONMENT'],
              'project': os.environ['GCP_PROJECT_ID'],
              'region': os.environ['GCP_REGION'],
              'source_sha': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['EVIDENCE_RUN_ID'],
              'run_attempt': os.environ['EVIDENCE_RUN_ATTEMPT'],
          }
          for key, value in expected.items():
              if receipt.get(key) != value or type(receipt.get(key)) is not type(value):
                  raise SystemExit(f'Evidence mismatch: {key}')
          if expected['kind'] == 'migration':
              if not re.fullmatch(r'clearcut-migrate-[a-z0-9-]+', receipt.get('execution', '')):
                  raise SystemExit('Missing successful migration execution')
              for key in ('build_run_id', 'build_run_attempt'):
                  if not re.fullmatch(r'[1-9][0-9]*', receipt.get(key, '')):
                      raise SystemExit(f'Missing build provenance: {key}')
          PY

      - name: Authenticate with keyless Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
          create_credentials_file: false
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute digest-pinned one-shot migration
        id: execute
        shell: bash
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          gcloud run jobs update "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --command sh \
            --args=-c,"python -m clearcut.bootstrap.preflight --expected-profile gcp && alembic upgrade head" \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --wait --format=json > migration-execution.json

      - name: Record successful digest-bound migration evidence
        id: record_evidence
        shell: bash
        env:
          EVIDENCE_RUN_ATTEMPT: ${{ steps.verify_run.outputs.attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import UTC, datetime
          from pathlib import Path

          execution = json.loads(Path('migration-execution.json').read_text())
          name = execution.get('metadata', {}).get('name', '')
          containers = execution.get('spec', {}).get('template', {}).get('spec', {}).get('containers', [])
          completed = [c for c in execution.get('status', {}).get('conditions', []) if c.get('type') == 'Completed']
          if not re.fullmatch(r'clearcut-migrate-[a-z0-9-]+', name):
              raise SystemExit('Missing migration execution identity')
          if len(containers) != 1 or containers[0].get('image') != os.environ['IMAGE']:
              raise SystemExit('Executed migration image did not match the release digest')
          expected_command = [
              '-c',
              'python -m clearcut.bootstrap.preflight --expected-profile gcp && alembic upgrade head',
          ]
          if containers[0].get('command') != ['sh'] or containers[0].get('args') != expected_command:
              raise SystemExit('Executed migration command did not match the GCP preflight and Alembic upgrade')
          if len(completed) != 1 or completed[0].get('status') != 'True':
              raise SystemExit('Migration execution did not complete successfully')
          receipt = {
              'schema_version': 1,
              'kind': 'migration',
              'result': 'success',
              'image': os.environ['IMAGE'],
              'environment': os.environ['RELEASE_ENVIRONMENT'],
              'project': os.environ['GCP_PROJECT_ID'],
              'region': os.environ['GCP_REGION'],
              'source_sha': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.now(UTC).isoformat(),
              'execution': name,
              'build_run_id': os.environ['EVIDENCE_RUN_ID'],
              'build_run_attempt': os.environ['EVIDENCE_RUN_ATTEMPT'],
          }
          Path('migration-evidence.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Preserve immutable migration evidence
        id: upload_evidence
        uses: actions/upload-artifact@v4
        with:
          name: clearcut-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration-evidence.json
          if-no-files-found: error
          retention-days: 30
