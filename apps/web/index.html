<!doctype html>
<html lang="en" data-theme="script">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ClearCut helps production teams find screenplay clearance risks, connect them to source evidence, and record accountable human decisions.">
  <meta name="theme-color" content="#f6f3ea">
  <meta name="color-scheme" content="light dark">
  <title>ClearCut — Screenplay clearance with a paper trail</title>
  <script>
    try {
      var saved = localStorage.getItem("clearcut_theme");
      var migrated = { "day-shoot": "script", "night-shoot": "night", "high-contrast": "night" }[saved] || saved;
      var theme = (migrated === "script" || migrated === "night") ? migrated : "script";
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "night" ? "#14161b" : "#f6f3ea");
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
