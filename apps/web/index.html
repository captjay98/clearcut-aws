<!doctype html>
<html lang="en" data-theme="script" class="script">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ClearCut helps production teams find screenplay clearance risks, connect them to source evidence, and record accountable human decisions.">
  <meta name="theme-color" content="#0f172a">
  <title>ClearCut — Screenplay clearance with a paper trail</title>
  <script>
    try {
      var saved = localStorage.getItem("clearcut_theme");
      var migrated = { "day-shoot": "script", "night-shoot": "night", "high-contrast": "night" }[saved] || saved;
      var theme = (migrated === "script" || migrated === "night") ? migrated : "script";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.className = theme + (theme === "night" ? " dark" : "");
    } catch (e) {}
  </script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
