substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'clearcut'

steps:
  # 1. Build immutable container image using root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--label', 'org.opencontainers.image.revision=$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:sha-$COMMIT_SHA',
      '.'
    ]

  # 2. Push container image to registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'gcr.io/$PROJECT_ID/$_SERVICE_NAME:sha-$COMMIT_SHA'
    ]

  # 3. Resolve exact immutable image digest
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        IMAGE_TAG="gcr.io/$PROJECT_ID/$_SERVICE_NAME:sha-$COMMIT_SHA"
        DIGEST="$$(gcloud container images describe "$$IMAGE_TAG" --format='value(image_summary.digest)' 2>/dev/null || gcloud artifacts docker images describe "$$IMAGE_TAG" --format='value(image_summary.digest)' 2>/dev/null)"
        test -n "$$DIGEST"
        printf '%s@%s\n' "gcr.io/$PROJECT_ID/$_SERVICE_NAME" "$$DIGEST" > /workspace/release-image.txt
        cat /workspace/release-image.txt

  # 4. Deploy container image to Cloud Run (handles first-time service creation and candidate updates)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        IMAGE="$$(cat /workspace/release-image.txt)"
        if gcloud run services describe "$_SERVICE_NAME" --region "$_REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
          TRAFFIC_ARGS="--no-traffic --tag candidate-$SHORT_SHA"
        else
          TRAFFIC_ARGS="--tag candidate-$SHORT_SHA"
        fi

        gcloud run deploy "$_SERVICE_NAME" \
          --image "$$IMAGE" \
          --region "$_REGION" \
          --project "$PROJECT_ID" \
          --allow-unauthenticated \
          $$TRAFFIC_ARGS \
          --min-instances 0 --max-instances 5 --cpu 1 --memory 1Gi --concurrency 80 \
          --timeout 300 \
          --labels "source-sha=$COMMIT_SHA,environment=prod" \
          --set-env-vars "WEB_DIST_PATH=/app/web-dist"

  # 5. Candidate Smoke Gate Test & Promotion
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        # Ensure public invoker role is attached
        gcloud run services add-iam-policy-binding "$_SERVICE_NAME" \
          --region "$_REGION" --member="allUsers" --role="roles/run.invoker" --project "$PROJECT_ID" || true

        # Promote traffic to latest revision
        gcloud run services update-traffic "$_SERVICE_NAME" \
          --region "$_REGION" --project "$PROJECT_ID" --to-latest

        # Run smoke test on main service URL
        SERVICE_URL="$$(gcloud run services describe "$_SERVICE_NAME" --region "$_REGION" --project "$PROJECT_ID" --format='value(status.url)')"
        echo "Service URL: $$SERVICE_URL"
        python3 /workspace/scripts/deployment_smoke.py --url "$$SERVICE_URL"
        echo "✅ ClearCut production deployment and smoke verification passed!"

options:
  logging: CLOUD_LOGGING_ONLY
