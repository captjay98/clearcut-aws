# Build the single production application artifact; deployment and traffic
# promotion remain explicit operations outside this build configuration.
substitutions:
  _REGISTRY_HOST: "us-central1-docker.pkg.dev"
  _REPOSITORY: "clearcut"

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-clearcut-image"
    args:
      - "build"
      - "--label"
      - "org.opencontainers.image.revision=$COMMIT_SHA"
      - "--tag"
      - "${_REGISTRY_HOST}/$PROJECT_ID/${_REPOSITORY}/clearcut:sha-$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "verify-revision-label"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        IMAGE="${_REGISTRY_HOST}/$PROJECT_ID/${_REPOSITORY}/clearcut:sha-$COMMIT_SHA"
        test "$$(docker inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$$IMAGE")" = "$COMMIT_SHA"

images:
  - "${_REGISTRY_HOST}/$PROJECT_ID/${_REPOSITORY}/clearcut:sha-$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
