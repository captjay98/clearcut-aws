version: "3.8"

x-clearcut-runtime: &clearcut-runtime
  build:
    context: .
    dockerfile: Dockerfile
  image: clearcut-local:latest
  environment: &clearcut-environment
    DATABASE_URL: postgresql+asyncpg://clearcut:clearcut_dev_password@db:5432/clearcut
    PORT: 8080
    PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
    GCP_PROJECT: ${GCP_PROJECT:-clearcut-workspace}
    VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
    CLEARCUT_SEED_DEMO: ${CLEARCUT_SEED_DEMO:-false}
    CLEARCUT_JOB_DISPATCH_MODE: ${CLEARCUT_JOB_DISPATCH_MODE:-local}
    CLEARCUT_API_WORKERS: ${CLEARCUT_API_WORKERS:-1}

services:
  db:
    image: postgres:17-alpine
    container_name: clearcut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearcut
      POSTGRES_PASSWORD: clearcut_dev_password
      POSTGRES_DB: clearcut
    ports:
      - "5432:5432"
    volumes:
      - clearcut_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearcut -d clearcut"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *clearcut-runtime
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *clearcut-runtime
    restart: "no"
    command: ["python", "scripts/seed_db.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *clearcut-runtime
    container_name: clearcut-app
    restart: unless-stopped
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

volumes:
  clearcut_pgdata:
    driver: local
