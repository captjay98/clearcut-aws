components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization UUIDv7
      schema:
        $ref: '#/components/schemas/UUIDv7'
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project UUIDv7
      schema:
        $ref: '#/components/schemas/UUIDv7'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-provided idempotency key for safe retries
      schema:
        type: string
        minLength: 16
        maxLength: 128

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: clearcut_session
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    UUIDv7:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUID version 7 identifier

    ISODateTime:
      type: string
      format: date-time
      description: ISO-8601 UTC timestamp

    UserRole:
      type: string
      enum:
        - owner
        - admin
        - editor
        - reviewer

    RunStatus:
      type: string
      description: Durable closed job status vocabulary
      enum:
        - queued
        - claimed
        - running
        - retry_wait
        - succeeded
        - failed
        - manual_retry
        - cancelled

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          $ref: '#/components/schemas/ISODateTime'
        version:
          type: string
          example: "0.1.0"

    SessionContext:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        userId:
          $ref: '#/components/schemas/UUIDv7'
        email:
          type: string
          format: email
        activeOrgId:
          $ref: '#/components/schemas/UUIDv7'
        role:
          $ref: '#/components/schemas/UserRole'

    CreateSessionRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    Organization:
      type: object
      required:
        - orgId
        - name
        - slug
        - createdAt
      properties:
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
        slug:
          type: string
        isDemo:
          type: boolean
          default: false
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"

    Project:
      type: object
      required:
        - projectId
        - orgId
        - title
        - createdAt
      properties:
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
        description:
          type: string
        isDemo:
          type: boolean
          default: false
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    CreateProjectRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string

    Invitation:
      type: object
      required:
        - invitationId
        - orgId
        - email
        - role
        - status
        - createdAt
      properties:
        invitationId:
          $ref: '#/components/schemas/UUIDv7'
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          type: string
          enum: [pending, accepted, declined, revoked]
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    CreateInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        projectGrants:
          type: array
          items:
            $ref: '#/components/schemas/UUIDv7'

    Membership:
      type: object
      required:
        - membershipId
        - orgId
        - userId
        - role
        - active
        - createdAt
      properties:
        membershipId:
          $ref: '#/components/schemas/UUIDv7'
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        userId:
          $ref: '#/components/schemas/UUIDv7'
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        projectGrants:
          type: array
          items:
            $ref: '#/components/schemas/UUIDv7'
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    ImportArtifact:
      type: object
      required:
        - artifactId
        - projectId
        - filename
        - status
        - createdAt
      properties:
        artifactId:
          $ref: '#/components/schemas/UUIDv7'
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        filename:
          type: string
        status:
          type: string
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    ParseRun:
      type: object
      required:
        - runId
        - artifactId
        - status
        - warnings
        - sceneCount
      properties:
        runId:
          $ref: '#/components/schemas/UUIDv7'
        artifactId:
          $ref: '#/components/schemas/UUIDv7'
        status:
          $ref: '#/components/schemas/RunStatus'
        warnings:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              message:
                type: string
        sceneCount:
          type: integer

    ScriptVersion:
      type: object
      required:
        - versionId
        - projectId
        - versionNumber
        - revisionLabel
        - createdAt
      properties:
        versionId:
          $ref: '#/components/schemas/UUIDv7'
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        versionNumber:
          type: integer
        revisionLabel:
          type: string
        sceneCount:
          type: integer
        itemCount:
          type: integer
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    Job:
      type: object
      required:
        - jobId
        - status
        - jobType
        - createdAt
      properties:
        jobId:
          $ref: '#/components/schemas/UUIDv7'
        status:
          $ref: '#/components/schemas/RunStatus'
        jobType:
          type: string
        progress:
          type: number
        error:
          type: string
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    ClearanceItem:
      type: object
      required:
        - itemId
        - projectId
        - category
        - entityName
        - status
      properties:
        itemId:
          $ref: '#/components/schemas/UUIDv7'
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        versionId:
          $ref: '#/components/schemas/UUIDv7'
        category:
          type: string
        entityName:
          type: string
        contextText:
          type: string
        status:
          type: string
        disposition:
          type: string
        assignedTo:
          $ref: '#/components/schemas/UUIDv7'
        dueDate:
          $ref: '#/components/schemas/ISODateTime'
        claimCount:
          type: integer

    SourceSnapshot:
      type: object
      required:
        - snapshotId
        - url
        - retrievedAt
        - publisher
        - tier
      properties:
        snapshotId:
          $ref: '#/components/schemas/UUIDv7'
        url:
          type: string
        retrievedAt:
          $ref: '#/components/schemas/ISODateTime'
        publisher:
          type: string
        tier:
          type: string
        excerpt:
          type: string

    EvidenceClaim:
      type: object
      required:
        - claimId
        - snapshotId
        - claimText
        - stance
      properties:
        claimId:
          $ref: '#/components/schemas/UUIDv7'
        snapshotId:
          $ref: '#/components/schemas/UUIDv7'
        claimText:
          type: string
        stance:
          type: string
        confidence:
          type: number

    ItemEvidence:
      type: object
      required:
        - itemId
        - claims
        - snapshots
      properties:
        itemId:
          $ref: '#/components/schemas/UUIDv7'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceClaim'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/SourceSnapshot'

    RecordDecisionRequest:
      type: object
      required:
        - decision
        - rationale
      properties:
        decision:
          type: string
          enum: [cleared, flagged, rejected, further_review]
        rationale:
          type: string
        expectedVersion:
          type: integer

    Referral:
      type: object
      required:
        - referralId
        - itemId
        - targetRole
        - question
        - status
      properties:
        referralId:
          $ref: '#/components/schemas/UUIDv7'
        itemId:
          $ref: '#/components/schemas/UUIDv7'
        targetRole:
          type: string
        question:
          type: string
        response:
          type: string
        status:
          type: string

    Comment:
      type: object
      required:
        - commentId
        - authorId
        - body
        - createdAt
      properties:
        commentId:
          $ref: '#/components/schemas/UUIDv7'
        itemId:
          $ref: '#/components/schemas/UUIDv7'
        authorId:
          $ref: '#/components/schemas/UUIDv7'
        authorEmail:
          type: string
        body:
          type: string
        parentId:
          $ref: '#/components/schemas/UUIDv7'
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    RewriteProposal:
      type: object
      required:
        - proposalId
        - itemId
        - proposedText
        - status
      properties:
        proposalId:
          $ref: '#/components/schemas/UUIDv7'
        itemId:
          $ref: '#/components/schemas/UUIDv7'
        proposedText:
          type: string
        rationale:
          type: string
        status:
          type: string
          enum: [proposed, approved, rejected, withdrawn]

    MonitoringPolicy:
      type: object
      required:
        - projectId
        - cadence
        - active
      properties:
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        cadence:
          type: string
        active:
          type: boolean
        lastRunAt:
          $ref: '#/components/schemas/ISODateTime'

    MonitoringRun:
      type: object
      required:
        - runId
        - projectId
        - status
        - itemsChecked
        - changesDetected
      properties:
        runId:
          $ref: '#/components/schemas/UUIDv7'
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        status:
          $ref: '#/components/schemas/RunStatus'
        itemsChecked:
          type: integer
        changesDetected:
          type: integer
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    Notification:
      type: object
      required:
        - notificationId
        - orgId
        - title
        - body
        - read
        - createdAt
      properties:
        notificationId:
          $ref: '#/components/schemas/UUIDv7'
        orgId:
