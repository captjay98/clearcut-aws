openapi: 3.1.0
info:
  title: ClearCut API
  version: 1.0.0
  description: Screenplay Pre-Clearance Evidence Workspace API
servers:
  - url: /
    description: Current origin
paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: getHealth
      tags:
        - health
      responses:
        '200':
          description: Service is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/session-context:
    get:
      summary: Retrieve current authenticated session and tenancy context
      operationId: getSessionContext
      tags:
        - session
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Current session context
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/SessionContext'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/sessions:
    post:
      summary: Create a new authenticated session
      operationId: createSession
      tags:
        - session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/SessionContext'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Invalid credentials or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/sessions/current:
    delete:
      summary: Revoke current session
      operationId: deleteCurrentSession
      tags:
        - session
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '204':
          description: Session revoked successfully
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/password-recovery-requests:
    post:
      summary: Request password recovery token
      operationId: requestPasswordRecovery
      tags:
        - session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password recovery request accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/password-recovery-completions:
    post:
      summary: Complete password recovery using token
      operationId: completePasswordRecovery
      tags:
        - session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password recovered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organization-entry:
    get:
      summary: Resolve organization entry for current user
      operationId: resolveOrganizationEntry
      tags:
        - organizations
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Resolved organization entry destination
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - hasOrganizations
                    properties:
                      hasOrganizations:
                        type: boolean
                      defaultOrgSlug:
                        type: string
                        nullable: true
                      defaultOrgId:
                        $ref: '#/components/schemas/UUIDv7'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations:
    get:
      summary: List organizations for current user
      operationId: listOrganizations
      tags:
        - organizations
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: List of accessible organizations
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Create a new organization
      operationId: createOrganization
      tags:
        - organizations
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{orgId}/projects:
    get:
      summary: List film projects within an organization
      operationId: listProjects
      tags:
        - projects
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Projects list
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Create a new film project
      operationId: createProject
      tags:
        - projects
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{orgId}/projects/{projectId}:
    get:
      summary: Get details of a project
      operationId: getProject
      tags:
        - projects
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{orgId}/invitations:
    post:
      summary: Create an invitation to join organization
      operationId: createInvitation
      tags:
        - invitations
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/invitations/{invitationId}:resend:
    post:
      summary: Resend an invitation
      operationId: resendInvitation
      tags:
        - invitations
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: invitationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/invitations/{invitationId}:revoke:
    post:
      summary: Revoke an invitation
      operationId: revokeInvitation
      tags:
        - invitations
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: invitationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/invitations/{token}:accept:
    post:
      summary: Accept an invitation using secret token
      operationId: acceptInvitation
      tags:
        - invitations
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/invitations/{token}:decline:
    post:
      summary: Decline an invitation using secret token
      operationId: declineInvitation
      tags:
        - invitations
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - declined
                    properties:
                      declined:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/memberships:
    get:
      summary: List members in an organization
      operationId: listOrganizationMembers
      tags:
        - memberships
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Organization memberships list
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/memberships/{membershipId}:changeRole:
    post:
      summary: Change member role within organization
      operationId: changeMembershipRole
      tags:
        - memberships
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: membershipId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/memberships/{membershipId}:changeProjectGrant:
    post:
      summary: Change project grants for a member
      operationId: changeProjectGrant
      tags:
        - memberships
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: membershipId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectIds
              properties:
                projectIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Project grant changed
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/memberships/{membershipId}:deactivate:
    post:
      summary: Deactivate a membership
      operationId: deactivateMembership
      tags:
        - memberships
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: membershipId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Member deactivated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/memberships/{membershipId}:reactivate:
    post:
      summary: Reactivate a deactivated membership
      operationId: reactivateMembership
      tags:
        - memberships
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: membershipId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Member reactivated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/upload-capabilities:
    post:
      summary: Create upload capability / signed upload slot
      operationId: createUploadCapability
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - mimeType
                - sizeBytes
              properties:
                filename:
                  type: string
                mimeType:
                  type: string
                sizeBytes:
                  type: integer
      responses:
        '201':
          description: Upload capability created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - artifactId
                      - uploadUrl
                    properties:
                      artifactId:
                        $ref: '#/components/schemas/UUIDv7'
                      uploadUrl:
                        type: string
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/import-artifacts/{artifactId}:finalize:
    post:
      summary: Finalize uploaded import artifact
      operationId: finalizeImportArtifact
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: artifactId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Import artifact finalized
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ImportArtifact'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/paste-imports:
    post:
      summary: Import script content via raw text paste
      operationId: createPasteImport
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rawText
                - format
              properties:
                rawText:
                  type: string
                format:
                  type: string
                  enum: [fountain, fdx, raw]
      responses:
        '201':
          description: Paste import created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ImportArtifact'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/import-artifacts/{artifactId}:parse:
    post:
      summary: Start parsing an import artifact
      operationId: parseImportArtifact
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: artifactId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '202':
          description: Parse job initiated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ParseRun'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/parse-runs/{runId}:acceptWarnings:
    post:
      summary: Acknowledge and accept parse warnings
      operationId: acceptParseWarnings
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: runId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Warnings accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ParseRun'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/parse-runs/{runId}:commitVersion:
    post:
      summary: Commit parsed script as immutable version
      operationId: commitScriptVersion
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: runId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '201':
          description: Version committed
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ScriptVersion'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/script-versions:
    get:
      summary: List committed script versions for a project
      operationId: listProjectVersions
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Script versions list
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScriptVersion'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/script-versions/{versionId}:
    get:
      summary: Get details of a script version
      operationId: getProjectVersion
      tags:
        - scripts
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: versionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Script version details
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ScriptVersion'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/script-versions/{versionId}:detect:
    post:
      summary: Start entity clearance detection on script version
      operationId: startDetection
      tags:
        - detection
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: versionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '202':
          description: Detection job started
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/clearance-items/{itemId}:research:
    post:
      summary: Start automated Parallel search & extract research for a clearance item
      operationId: startResearch
      tags:
        - research
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: itemId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '202':
          description: Research job started
