      responses:
        '201':
          description: Report snapshot generated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ReportSnapshot'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/report-snapshots/{snapshotId}:
    get:
      summary: Get report snapshot by ID
      operationId: getReportSnapshot
      tags:
        - reports
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: snapshotId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Report snapshot details
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ReportSnapshot'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/report-snapshots/{snapshotId}:release:
    post:
      summary: Officially release report snapshot (governed action)
      operationId: releaseReport
      tags:
        - reports
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: snapshotId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - attestation
              properties:
                attestation:
                  type: string
                  minLength: 40
                  maxLength: 2000
      responses:
        '200':
          description: Report released
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ReportRelease'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/report-history:
    get:
      summary: List report snapshots, releases, and redacted receipts
      operationId: listReportHistory
      tags:
        - reports
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Governed report history
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportHistoryEntry'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/report-releases/{releaseId}/artifact-metadata:
    get:
      summary: Read authorized released-report artifact metadata
      operationId: getReportDownloadMetadata
      tags:
        - reports
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: releaseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Authorized released HTML artifact metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ReportArtifactMetadata'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /api/v1/organizations/{orgId}/projects/{projectId}/report-releases/{releaseId}/artifact:
    get:
      summary: Download released report artifact PDF/HTML
      operationId: downloadReleasedReport
      tags:
        - reports
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: releaseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Report artifact content
          content:
            application/json:
              schema:
                type: object
                required:
                  - downloadUrl
                properties:
                  downloadUrl:
                    type: string

components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization UUIDv7
      schema:
        $ref: '#/components/schemas/UUIDv7'
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project UUIDv7
      schema:
        $ref: '#/components/schemas/UUIDv7'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-provided idempotency key for safe retries when supported
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-provided idempotency key required for safe, intent-bound command retries
      schema:
        type: string
        minLength: 16
        maxLength: 128

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: clearcut_session
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    UUIDv7:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUID version 7 identifier

    ISODateTime:
      type: string
      format: date-time
      description: ISO-8601 UTC timestamp

    UserRole:
      type: string
      enum:
        - owner
        - admin
        - editor
        - reviewer

    RunStatus:
      type: string
      description: Durable closed job status vocabulary
      enum:
        - queued
        - claimed
        - running
        - retry_wait
        - succeeded
        - failed
        - manual_retry
        - cancelled

    JobDispatchMetadata:
      type: object
      required:
        - mode
        - durable
      properties:
        mode:
          type: string
          enum: [disabled, local, cloud_tasks]
        durable:
          type: boolean

    DeploymentMetadata:
      type: object
      required:
        - profile
        - databaseConfigured
        - storageAdapter
        - dispatchAdapter
        - dispatchEnabled
        - authenticationAdapter
        - secretBackend
        - paidProvidersEnabled
      properties:
        profile:
          type: string
          enum: [local, portable, gcp]
        databaseConfigured:
          type: boolean
        storageAdapter:
          type: string
          enum: [filesystem, s3, gcs]
        dispatchAdapter:
          type: string
          enum: [local, postgres, cloud_tasks]
        dispatchEnabled:
          type: boolean
        authenticationAdapter:
          type: string
          enum: [builtin, firebase]
        secretBackend:
          type: string
          enum: [environment, host, secret_manager]
        paidProvidersEnabled:
          type: array
          items:
            type: string
            enum: [gemini, parallel]

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - deployment
        - jobDispatch
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          $ref: '#/components/schemas/ISODateTime'
        version:
          type: string
          example: "0.1.0"
        deployment:
          $ref: '#/components/schemas/DeploymentMetadata'
        jobDispatch:
          $ref: '#/components/schemas/JobDispatchMetadata'

    SessionContext:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        userId:
          anyOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        email:
          anyOf:
            - type: string
              format: email
            - type: 'null'
        activeOrgId:
          anyOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        role:
          anyOf:
            - $ref: '#/components/schemas/UserRole'
            - type: 'null'

    CreateSessionRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    Organization:
      type: object
      required:
        - orgId
        - name
        - slug
        - createdAt
      properties:
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
        slug:
          type: string
        isDemo:
          type: boolean
          default: false
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-z0-9-]+$"

    Project:
      type: object
      required:
        - projectId
        - orgId
        - title
        - productionType
        - productionStage
        - jurisdiction
        - targetLockDate
        - reviewBrief
        - createdAt
      properties:
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        title:
          type: string
        description:
          anyOf:
            - type: string
            - type: 'null'
        productionType:
          anyOf:
            - type: string
            - type: 'null'
        productionStage:
          anyOf:
            - type: string
            - type: 'null'
        jurisdiction:
          anyOf:
            - type: string
            - type: 'null'
        targetLockDate:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        reviewBrief:
          anyOf:
            - type: string
            - type: 'null'
        isDemo:
          type: boolean
          default: false
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    CreateProjectRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
            - type: string
            - type: 'null'
        productionType:
          anyOf:
            - type: string
              maxLength: 100
            - type: 'null'
        productionStage:
          anyOf:
            - type: string
              maxLength: 100
            - type: 'null'
        jurisdiction:
          anyOf:
            - type: string
              maxLength: 200
            - type: 'null'
        targetLockDate:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        reviewBrief:
          anyOf:
            - type: string
            - type: 'null'

    Invitation:
      type: object
      required:
        - invitationId
        - orgId
        - email
        - role
        - status
        - createdAt
      properties:
        invitationId:
          $ref: '#/components/schemas/UUIDv7'
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          type: string
          enum: [pending, accepted, declined, revoked]
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    CreateInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        projectGrants:
          type: array
          items:
            $ref: '#/components/schemas/UUIDv7'

    Membership:
      type: object
      required:
        - membershipId
        - orgId
        - userId
        - role
        - active
        - createdAt
      properties:
        membershipId:
          $ref: '#/components/schemas/UUIDv7'
        orgId:
          $ref: '#/components/schemas/UUIDv7'
        userId:
          $ref: '#/components/schemas/UUIDv7'
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        projectGrants:
          type: array
          items:
            $ref: '#/components/schemas/UUIDv7'
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    ImportArtifact:
      type: object
      required:
        - artifactId
        - projectId
        - filename
        - contentType
        - sizeBytes
        - sha256
        - status
        - createdAt
      properties:
        artifactId:
          $ref: '#/components/schemas/UUIDv7'
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          type: string
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    ParseWarning:
      type: object
      required:
        - code
        - line
        - message
      properties:
        code:
          type: string
        line:
          anyOf:
            - type: integer
            - type: 'null'
        message:
          type: string

    ParseRun:
      type: object
      required:
        - runId
        - artifactId
        - status
        - parserName
        - parserVersion
        - warnings
        - sceneCount
        - elementCount
        - warningsAccepted
        - acceptedAt
        - createdAt
        - completedAt
      properties:
        runId:
          $ref: '#/components/schemas/UUIDv7'
        artifactId:
          $ref: '#/components/schemas/UUIDv7'
        status:
          $ref: '#/components/schemas/RunStatus'
        parserName:
          type: string
        parserVersion:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'
        sceneCount:
          type: integer
          minimum: 0
        elementCount:
          type: integer
          minimum: 0
        warningsAccepted:
          type: boolean
        acceptedAt:
          anyOf:
            - $ref: '#/components/schemas/ISODateTime'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/ISODateTime'
        completedAt:
          $ref: '#/components/schemas/ISODateTime'

    ScriptVersion:
      type: object
      required:
        - versionId
        - scriptId
        - projectId
        - versionNumber
        - revisionLabel
        - title
        - ordinal
        - sourceArtifactId
        - parseRunId
        - sourceHash
        - parserVersion
        - sceneCount
        - elementCount
        - createdAt
      properties:
        versionId:
          $ref: '#/components/schemas/UUIDv7'
        scriptId:
          $ref: '#/components/schemas/UUIDv7'
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        versionNumber:
          type: integer
        revisionLabel:
          type: string
        title:
          type: string
        ordinal:
          type: integer
        sourceArtifactId:
          anyOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        parseRunId:
          anyOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        sourceHash:
          type: string
        parserVersion:
          type: string
        sceneCount:
          type: integer
          minimum: 0
        elementCount:
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    ScriptDiffChangeKind:
      type: string
      description: Classification of how a script element changed between two versions
      enum:
        - unchanged
        - moved
        - modified
        - added
        - removed

    ScriptDiffConfidence:
      type: string
      description: Confidence with which an element was matched across versions
      enum:
        - exact
        - contextual
        - similar
        - unmatched

    ScriptDiffElement:
      type: object
      description: A single element-level change between the before and after versions
      required:
        - type
        - changeKind
        - confidence
      properties:
        beforeElementId:
          anyOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
          description: Element ID in the predecessor (before) version, if present
        afterElementId:
          anyOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
          description: Element ID in the current (after) version, if present
        beforeOrdinal:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
          description: Ordinal position in the before version, if present
        afterOrdinal:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
          description: Ordinal position in the after version, if present
        type:
          type: string
          description: Screenplay element type (e.g. scene_heading, action, dialogue)
        text:
          type: string
          description: Representative element text for review context
        changeKind:
          $ref: '#/components/schemas/ScriptDiffChangeKind'
        confidence:
          $ref: '#/components/schemas/ScriptDiffConfidence'

    ScriptDiffSummary:
      type: object
      description: Aggregate counts describing the scope of a version diff
      required:
        - unchanged
        - moved
        - modified
        - added
        - removed
        - affectedElementCount
        - carriedForwardItemCount
        - carriedForwardEvidenceCount
        - providerWorkEstimate
      properties:
        unchanged:
          type: integer
          minimum: 0
        moved:
          type: integer
          minimum: 0
        modified:
          type: integer
          minimum: 0
        added:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
        affectedElementCount:
          type: integer
          minimum: 0
          description: Number of elements changed enough to affect clearance scope
        carriedForwardItemCount:
          type: integer
          minimum: 0
          description: Clearance items carried forward unchanged from the predecessor
        carriedForwardEvidenceCount:
          type: integer
          minimum: 0
          description: Evidence claims carried forward unchanged from the predecessor
        providerWorkEstimate:
          type: integer
          minimum: 0
          description: Estimated provider research units required for the affected scope

    ScriptVersionDiff:
      type: object
      description: >-
        Persisted, algorithm-versioned diff between a committed script version
        and its immediate predecessor.
      required:
        - beforeVersionId
        - afterVersionId
        - beforeLabel
        - afterLabel
        - algorithmVersion
        - elements
        - summary
        - createdAt
      properties:
        beforeVersionId:
          anyOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
          description: Predecessor version ID; null for the first committed version
        afterVersionId:
          $ref: '#/components/schemas/UUIDv7'
        beforeLabel:
          anyOf:
            - type: string
            - type: 'null'
          description: Predecessor revision label; null for the first committed version
        afterLabel:
          type: string
          description: Revision label of the current (after) version
        algorithmVersion:
          type: string
          description: Version of the diff algorithm that produced this result
        elements:
          type: array
          description: Ordered element-level changes
          items:
            $ref: '#/components/schemas/ScriptDiffElement'
        summary:
          $ref: '#/components/schemas/ScriptDiffSummary'
        createdAt:
          $ref: '#/components/schemas/ISODateTime'

    ProjectScriptLine:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum: [scene_heading, action, character, parenthetical, dialogue, transition]
        text:
          type: string
        flag:
          type: string

    ProjectScriptScene:
      type: object
      required:
        - number
        - slug
        - page
        - lines
      properties:
        number:
          type: integer
        slug:
          type: string
        page:
          anyOf:
            - type: integer
            - type: 'null'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ProjectScriptLine'

    ProjectScript:
      type: object
      required:
        - title
        - version
        - versionId
        - scenes
      properties:
        title:
          type: string
        version:
          type: string
        versionId:
          $ref: '#/components/schemas/UUIDv7'
        scenes:
          type: array
          items:
            $ref: '#/components/schemas/ProjectScriptScene'

    SafeJobError:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean

    JobAttempt:
      type: object
      required:
        - number
        - status
        - startedAt
        - completedAt
        - error
      properties:
        number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [running, succeeded, failed, cancelled, interrupted]
        startedAt:
          $ref: '#/components/schemas/ISODateTime'
        completedAt:
          anyOf:
            - $ref: '#/components/schemas/ISODateTime'
            - type: 'null'
        error:
          anyOf:
            - $ref: '#/components/schemas/SafeJobError'
            - type: 'null'

    JobLifecycleEvent:
      type: object
      required:
        - action
        - actorId
        - occurredAt
      properties:
        action:
          type: string
          enum: [cancelled, retry_requested]
        actorId:
          $ref: '#/components/schemas/UUIDv7'
        occurredAt:
          $ref: '#/components/schemas/ISODateTime'

    JobTarget:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [project, script_version, clearance_item, legacy_unknown]
        id:
          $ref: '#/components/schemas/UUIDv7'

    Job:
      type: object
      required:
        - jobId
        - status
        - jobType
        - target
        - canRetry
        - progress
        - stage
        - resultSummary
        - error
        - attemptCount
        - attempts
        - history
        - availableAt
        - createdAt
        - updatedAt
      properties:
        jobId:
          $ref: '#/components/schemas/UUIDv7'
        status:
          $ref: '#/components/schemas/RunStatus'
        jobType:
          type: string
        target:
          $ref: '#/components/schemas/JobTarget'
        canRetry:
          type: boolean
        progress:
          type: number
          minimum: 0
          maximum: 100
        stage:
          type: string
        resultSummary:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        error:
          anyOf:
            - $ref: '#/components/schemas/SafeJobError'
            - type: 'null'
        attemptCount:
          type: integer
          minimum: 0
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/JobAttempt'
        history:
          type: array
          items:
            $ref: '#/components/schemas/JobLifecycleEvent'
        availableAt:
          $ref: '#/components/schemas/ISODateTime'
        createdAt:
          $ref: '#/components/schemas/ISODateTime'
        updatedAt:
          $ref: '#/components/schemas/ISODateTime'

    ClearanceItem:
      type: object
      required:
        - itemId
        - projectId
        - version
        - category
        - entityName
        - status
      properties:
        itemId:
          $ref: '#/components/schemas/UUIDv7'
        projectId:
          $ref: '#/components/schemas/UUIDv7'
        versionId:
          $ref: '#/components/schemas/UUIDv7'
        version:
          type: integer
          minimum: 0
          description: Current optimistic concurrency version for the item
        category:
          type: string
        entityName:
          type: string
        contextText:
          type: string
        status:
          type: string
        disposition:
          $ref: '#/components/schemas/ClearanceDisposition'
        assignedTo:
          $ref: '#/components/schemas/UUIDv7'
        dueDate:
          $ref: '#/components/schemas/ISODateTime'
        claimCount:
          type: integer

    ItemEvidenceState:
      type: object
      additionalProperties: false
      required:
        - status
        - unresolved
        - claimCount
        - reason
      properties:
        status:
          type: string
          enum: [pending, no_results, failed, unavailable, cited]
        unresolved:
          type: boolean
          description: Always true until a qualified human completes the governed workflow.
        claimCount:
          type: integer
          minimum: 0
        reason:
          type: string

    ItemDetailEvidenceClaim:
      type: object
      additionalProperties: false
      required:
        - claimId
        - snapshotId
        - claimText
        - stance
        - authorityTier
        - provenanceExcerpt
        - createdAt
      properties:
        claimId:
          $ref: '#/components/schemas/UUIDv7'
        snapshotId:
          $ref: '#/components/schemas/UUIDv7'
        claimText:
          type: string
        stance:
          type: string
