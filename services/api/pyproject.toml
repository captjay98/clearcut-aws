[project]
name = "clearcut-api"
version = "0.1.0"
description = "ClearCut Backend Modular Monolith API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic[email]>=2.8.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "argon2-cffi>=23.1.0",
    "uuid6>=2024.1.12",
    "pyyaml>=6.0.1",
    "greenlet>=3.5.5",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearcut"]
